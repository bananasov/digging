services:
  digging:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set to "metrics" to enable, leave empty to disable
        FEATURES: "${FEATURES:-}"
    image: digging:latest
    container_name: digging
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - BIND_ADDRESS=${BIND_ADDRESS:-0.0.0.0:3000}
      - RUST_LOG=${RUST_LOG:-digging=debug,tower_http=debug}
      # Uncomment below when you set up OTLP exporter for metrics
      # - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      # - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      # - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-digging}
    restart: unless-stopped
    # Uncomment for production health checks
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 40s

