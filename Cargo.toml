[package]
name = "digging"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["tracing"] }
kameo = "0.19.2"
sockudo-ws = "1.7.4"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
bytes = "1.11.1"
futures = "0.3.31"
snafu = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
hyper = "1.8.1"
hyper-util = "0.1.20"
serde_json = "1.0.149"
chrono = "0.4.43"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }

# Metrics (optional, enabled via 'metrics' feature)
metrics = { version = "0.24", optional = true }

[features]
default = []
metrics = [
    "dep:metrics",
    "kameo/metrics",
]
